services:
  - type: web
    name: fraudguard-ai-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: fraudguard_db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: MODEL_PATH
        value: ../ml/models/fraud_model.joblib
      - key: PREPROCESSOR_PATH
        value: ../ml/models/preprocessor.joblib
      - key: FEATURE_NAMES_PATH
        value: ../ml/models/feature_names.json
      - key: METRICS_PATH
        value: ../ml/reports/metrics.json
      - key: CORS_ORIGINS
        value: http://localhost:5173
